services:
  - type: web
    name: educontrol
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    # Persist SQLite across deploys/restarts — REQUIRES Starter plan or higher (free has ephemeral FS, data wipes on restart)
    disk:
      name: educontrol-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
