services:
  - type: web
    name: educontrol
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    # FREE plan: disk is ignored (ephemeral FS) — data wipes on restart. Use Download Backup daily.
    # To make data permanent, change to plan: starter and keep this disk block.
