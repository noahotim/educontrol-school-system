services:
  - type: web
    name: educontrol
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    # Persist SQLite across deploys/restarts (1GB disk — survives ephemeral wipes, keeps your nm users)
    disk:
      name: educontrol-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
